# Serviços locais de desenvolvimento. Suba com `pnpm services:up` (lê o .env.local; veja .env.example).
services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: bosun
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env.local}
      POSTGRES_DB: bosun
    ports: ["127.0.0.1:5432:5432"]
    volumes: [postgres:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bosun"]
      interval: 2s
      retries: 30
  rustfs:
    image: rustfs/rustfs:1.0.3
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?defina no .env.local}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?defina no .env.local}
    ports: ["127.0.0.1:9000:9000"]
    volumes: [rustfs:/data]
  waha:
    image: devlikeapro/waha:gows-2026.9.2
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY:?defina no .env.local}
    ports: ["127.0.0.1:3001:3000"]
    volumes: [waha:/app/.sessions]
volumes:
  postgres:
  rustfs:
  waha:
