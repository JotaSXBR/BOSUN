version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    # Igual ao minimumReleaseAge do pnpm-workspace.yaml: nada com menos de 1 dia.
    cooldown: { default-days: 1 }
    groups:
      # Major sai em PR próprio, para revisar e bisectar.
      npm-minor-patch: { patterns: ["*"], update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directories: [/, /.github/actions/setup]
    schedule: { interval: weekly }
    cooldown: { default-days: 1 }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: docker
    directory: /.github/osv-scanner
    schedule: { interval: weekly }
    cooldown: { default-days: 1 }
  - package-ecosystem: docker
    directory: /.github/gitleaks
    schedule: { interval: weekly }
    cooldown: { default-days: 1 }
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 1 }
