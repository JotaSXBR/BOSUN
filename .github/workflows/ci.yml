name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Na main todo commit termina: o release espera o CI verde.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: bosun
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: bosun
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U bosun" --health-interval 2s --health-retries 30
    env:
      DATABASE_URL: postgresql://bosun:ci-only@localhost:5432/bosun
      # Teto de exceções do oxlint: só sobe com aprovação no PR.
      LINT_EXCEPTIONS_MAX: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: bash scripts/test_lint_exceptions.sh && bash scripts/lint_exceptions.sh
      # Unitário e integração (contra o Postgres de serviço), com limites de cobertura.
      - run: pnpm test
      - run: pnpm dup
      - run: bash scripts/test_validate.sh && bash scripts/validate.sh ./okf

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: playwright-report, path: test-results/, retention-days: 7 }

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      # Só o histórico do commit testado (o padrão varre todas as branches do clone).
      # safe.directory: o checkout pertence ao usuário do runner, não ao do container.
      - name: gitleaks
        run: |
          docker build -q -t gitleaks .github/gitleaks
          docker run --rm -v "$PWD:/src" -w /src \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/src \
            gitleaks git --redact --no-banner --log-opts=HEAD .
      # Roda mesmo se o gitleaks falhar, para nenhum achado ficar escondido.
      - name: osv-scanner
        if: ${{ !cancelled() }}
        run: |
          docker build -q -t osv-scanner .github/osv-scanner
          docker run --rm -v "$PWD:/src" -w /src osv-scanner scan source --config=osv-scanner.toml --lockfile=pnpm-lock.yaml
